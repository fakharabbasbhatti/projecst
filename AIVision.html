<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>✨ AI Vision Forge | Next-Gen Image Generator</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 10% 30%, #0a0f2a, #030614);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      position: relative;
    }

    /* animated background particles (subtle) */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(rgba(120, 80, 255, 0.15) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .glass-card {
      width: 100%;
      max-width: 780px;
      background: rgba(15, 20, 45, 0.65);
      backdrop-filter: blur(14px);
      border-radius: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), 0 0 0 0.5px rgba(255, 255, 255, 0.1) inset;
      padding: 2rem 2rem 2.2rem;
      transition: all 0.3s ease;
      z-index: 2;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      padding: 6px 14px;
      border-radius: 80px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: white;
      margin-bottom: 1.2rem;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff, #c084fc, #a78bfa);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    .sub {
      color: #b9c3e8;
      font-weight: 500;
      margin-bottom: 1.8rem;
      border-left: 3px solid #a855f7;
      padding-left: 14px;
      font-size: 0.95rem;
    }

    .input-group {
      margin-bottom: 1.6rem;
    }

    .input-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
      color: #e2e8ff;
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }

    .char-counter {
      font-size: 0.7rem;
      background: rgba(255,255,255,0.1);
      padding: 2px 8px;
      border-radius: 30px;
    }

    input {
      width: 100%;
      background: rgba(10, 14, 30, 0.7);
      border: 1.5px solid rgba(168, 85, 247, 0.4);
      border-radius: 1.5rem;
      padding: 1rem 1.2rem;
      font-size: 1rem;
      color: white;
      outline: none;
      transition: all 0.25s;
      font-weight: 500;
    }

    input:focus {
      border-color: #c084fc;
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.3);
      background: rgba(10, 14, 30, 0.9);
    }

    input::placeholder {
      color: #6a6f9b;
      font-weight: 400;
    }

    /* button group */
    .action-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .btn-primary {
      flex: 2;
      background: linear-gradient(95deg, #7c3aed, #b14bef);
      border: none;
      padding: 12px 20px;
      border-radius: 3rem;
      font-weight: 700;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
    }

    .btn-primary:hover {
      transform: scale(0.97);
      background: linear-gradient(95deg, #6d28d9, #9b3ed9);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.5);
    }

    .btn-secondary {
      flex: 1;
      background: rgba(30, 35, 65, 0.9);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(168, 85, 247, 0.6);
      padding: 12px 18px;
      border-radius: 3rem;
      font-weight: 600;
      color: #e2d9ff;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-secondary:hover {
      background: #2a2f55;
      color: white;
      border-color: #c084fc;
    }

    /* image showcase */
    .image-stage {
      margin-top: 12px;
      border-radius: 2rem;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      min-height: 380px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .image-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .image-container img {
      max-width: 100%;
      max-height: 420px;
      border-radius: 1.5rem;
      box-shadow: 0 20px 30px -10px black;
      display: none;
      object-fit: contain;
      transition: 0.25s ease;
    }

    /* modern loader */
    .neon-loader {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .spinner-ring {
      width: 64px;
      height: 64px;
      border: 4px solid rgba(168, 85, 247, 0.2);
      border-top: 4px solid #c084fc;
      border-right: 4px solid #a855f7;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      box-shadow: 0 0 12px #a855f7;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: #c4b5fd;
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 1px;
      background: rgba(0,0,0,0.4);
      padding: 6px 14px;
      border-radius: 60px;
    }

    .empty-state {
      color: #8d99c9;
      text-align: center;
      font-weight: 500;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-state svg {
      opacity: 0.6;
    }

    .info-footer {
      margin-top: 20px;
      font-size: 0.7rem;
      text-align: center;
      color: #7d86b3;
      display: flex;
      justify-content: center;
      gap: 24px;
    }

    /* download toast */
    .toast-message {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293bdd;
      backdrop-filter: blur(8px);
      color: #e2e8f0;
      padding: 10px 26px;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 200;
      transition: 0.2s;
      pointer-events: none;
      border-left: 4px solid #a855f7;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .fade-out {
      opacity: 0;
      visibility: hidden;
    }

    @media (max-width: 550px) {
      .glass-card {
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.8rem;
      }
      .action-row {
        flex-direction: column;
      }
      .btn-primary, .btn-secondary {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="glass-card">
  <div class="badge">✨ AI · 4K Ready</div>
  <h1>Vision Forge</h1>
  <div class="sub">Next‑gen neural canvas — describe, generate, inspire.</div>

  <div class="input-group">
    <div class="input-label">
      <span>🎨 Prompt</span>
      <span class="char-counter" id="charCounter">0 / 400</span>
    </div>
    <input type="text" id="promptInput" placeholder="e.g., cyberpunk samurai with glowing katana, neon rain, 8K" autocomplete="off" maxlength="400" />
  </div>

  <div class="action-row">
    <button class="btn-primary" id="generateBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 4V20M20 12H4" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.8"/>
      </svg>
      Generate Image
    </button>
    <button class="btn-secondary" id="downloadBtn" disabled style="opacity: 0.6;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 16L4 18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 18V16M12 4V16M8 12L12 16L16 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Download
    </button>
    <button class="btn-secondary" id="clearBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 6L18 18M6 18L18 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      Clear
    </button>
  </div>

  <div class="image-stage">
    <div class="image-container" id="imageContainer">
      <div class="empty-state" id="emptyState">
        <svg width="70" height="70" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 16L8.58579 11.4142C9.36684 10.6332 10.6332 10.6332 11.4142 11.4142L15 15M13 10C13 11.1046 12.1046 12 11 12C9.89543 12 9 11.1046 9 10C9 8.89543 9.89543 8 11 8C12.1046 8 13 8.89543 13 10ZM19 20H5C3.89543 20 3 19.1046 3 18V6C3 4.89543 3.89543 4 5 4H19C20.1046 4 21 4.89543 21 6V18C21 19.1046 20.1046 20 19 20Z" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>✨ Your AI creation will appear here</span>
        <span style="font-size: 0.7rem;">powered by Pollinations AI</span>
      </div>
      <div class="neon-loader" id="loaderUI">
        <div class="spinner-ring"></div>
        <div class="loading-text">⚡ weaving pixels ...</div>
      </div>
      <img id="generatedImg" alt="AI generated masterpiece" />
    </div>
  </div>
  <div class="info-footer">
    <span>🧠 Instant AI · Text to Image</span>
    <span>🔮 High quality diffusion</span>
  </div>
</div>

<script>
  (function() {
    // DOM elements
    const promptInput = document.getElementById('promptInput');
    const generateBtn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const generatedImage = document.getElementById('generatedImg');
    const loaderDiv = document.getElementById('loaderUI');
    const emptyStateDiv = document.getElementById('emptyState');
    const charCounterSpan = document.getElementById('charCounter');

    let currentImageUrl = '';
    let isGenerating = false;

    // Helper: update char count
    function updateCharCount() {
      const len = promptInput.value.length;
      charCounterSpan.innerText = `${len} / 400`;
    }
    promptInput.addEventListener('input', updateCharCount);
    updateCharCount();

    // show/hide states
    function setLoading(isLoading) {
      isGenerating = isLoading;
      if (isLoading) {
        // hide image & empty state, show loader
        generatedImage.style.display = 'none';
        emptyStateDiv.style.display = 'none';
        loaderDiv.style.display = 'flex';
        downloadBtn.disabled = true;
        downloadBtn.style.opacity = '0.5';
        downloadBtn.style.cursor = 'default';
      } else {
        loaderDiv.style.display = 'none';
        // After loading we decide image visibility inside onload/error
      }
    }

    function displayImage(imgUrl) {
      currentImageUrl = imgUrl;
      generatedImage.src = imgUrl;
      // visibility toggles will happen after onload
    }

    function showEmptyStateWithMessage(message = null) {
      emptyStateDiv.style.display = 'flex';
      generatedImage.style.display = 'none';
      loaderDiv.style.display = 'none';
      downloadBtn.disabled = true;
      downloadBtn.style.opacity = '0.5';
      if (message && emptyStateDiv.querySelector('span:first-of-type')) {
        // update first span text but keep icon
        const textSpan = emptyStateDiv.querySelector('span:first-of-type');
        if (textSpan) textSpan.innerText = message;
        else {
          emptyStateDiv.innerHTML = `<svg width="70" height="70" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 16L8.58579 11.4142C9.36684 10.6332 10.6332 10.6332 11.4142 11.4142L15 15M13 10C13 11.1046 12.1046 12 11 12C9.89543 12 9 11.1046 9 10C9 8.89543 9.89543 8 11 8C12.1046 8 13 8.89543 13 10ZM19 20H5C3.89543 20 3 19.1046 3 18V6C3 4.89543 3.89543 4 5 4H19C20.1046 4 21 4.89543 21 6V18C21 19.1046 20.1046 20 19 20Z" stroke="#a78bfa" stroke-width="1.5"/></svg>
          <span>${message}</span>
          <span style="font-size: 0.7rem;">✨ try another prompt</span>`;
        }
      } else if (!message) {
        // reset default
        emptyStateDiv.innerHTML = `<svg width="70" height="70" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 16L8.58579 11.4142C9.36684 10.6332 10.6332 10.6332 11.4142 11.4142L15 15M13 10C13 11.1046 12.1046 12 11 12C9.89543 12 9 11.1046 9 10C9 8.89543 9.89543 8 11 8C12.1046 8 13 8.89543 13 10ZM19 20H5C3.89543 20 3 19.1046 3 18V6C3 4.89543 3.89543 4 5 4H19C20.1046 4 21 4.89543 21 6V18C21 19.1046 20.1046 20 19 20Z" stroke="#a78bfa" stroke-width="1.5"/></svg>
          <span>✨ Your AI creation will appear here</span>
          <span style="font-size: 0.7rem;">powered by Pollinations AI</span>`;
      }
    }

    // toasts helper
    function showToast(message, duration = 2000) {
      let existingToast = document.querySelector('.toast-message');
      if(existingToast) existingToast.remove();
      const toast = document.createElement('div');
      toast.className = 'toast-message';
      toast.innerText = message;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('fade-out');
        setTimeout(() => toast.remove(), 300);
      }, duration);
    }

    // Generate image core logic with advanced error handling
    async function generateImageFromPrompt(promptText) {
      if (!promptText || promptText.trim() === '') {
        showToast("⚠️ Please enter a creative prompt first", 1500);
        showEmptyStateWithMessage("✏️ Enter a prompt to begin");
        return false;
      }

      if (isGenerating) {
        showToast("⏳ Already generating, please wait...", 1200);
        return false;
      }

      setLoading(true);
      try {
        // Enhanced URL encoding: keep user creativity safe
        const encodedPrompt = encodeURIComponent(promptText.trim());
        // Using pollinations.ai with high quality parameters & seed random for variety
        const seed = Math.floor(Math.random() * 10000);
        const imageApiUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&seed=${seed}&nologo=true&model=flux`;
        
        // Create a promise that loads image with timeout
        const loadImagePromise = new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = "Anonymous"; // for better download safety (though not always needed)
          img.onload = () => {
            generatedImage.src = imageApiUrl;
            generatedImage.style.display = 'block';
            emptyStateDiv.style.display = 'none';
            loaderDiv.style.display = 'none';
            currentImageUrl = imageApiUrl;
            downloadBtn.disabled = false;
            downloadBtn.style.opacity = '1';
            downloadBtn.style.cursor = 'pointer';
            resolve(true);
          };
          img.onerror = () => {
            reject(new Error("Image loading failed: API might be overloaded or invalid prompt"));
          };
          img.src = imageApiUrl;
          // Timeout guard: if loading takes > 25 seconds
          setTimeout(() => {
            if (!img.complete) {
              reject(new Error("Request timeout: AI service is busy. Try again."));
            }
          }, 25000);
        });

        await loadImagePromise;
        showToast("🎉 Image ready! Right-click or tap download.", 1800);
        return true;

      } catch (err) {
        console.error("Generation error:", err);
        setLoading(false);
        showEmptyStateWithMessage(`⚠️ ${err.message || "Generation failed. Check internet & prompt."}`);
        downloadBtn.disabled = true;
        downloadBtn.style.opacity = '0.5';
        showToast(`❌ Error: ${err.message || "Could not generate image"}`, 2500);
        return false;
      } finally {
        isGenerating = false;
        // ensure loader hidden if any residual
        if (!loaderDiv.style.display === 'flex') {
          loaderDiv.style.display = 'none';
        }
      }
    }

    // Generate button handler
    generateBtn.addEventListener('click', async () => {
      const rawPrompt = promptInput.value;
      if (!rawPrompt.trim()) {
        showToast("✨ Please describe something magical...", 1300);
        promptInput.focus();
        return;
      }
      await generateImageFromPrompt(rawPrompt);
    });

    // Download with better fallback & support for blob (avoids cross-origin limits by using anchor)
    downloadBtn.addEventListener('click', async () => {
      if (!currentImageUrl || downloadBtn.disabled) {
        showToast("No image to download. Generate first!", 1500);
        return;
      }
      try {
        // For Pollinations, the URL is directly accessible. We'll create a fetch to get blob for reliable naming.
        // but to avoid CORS we can also just use anchor with download attribute (works in modern browsers if same-origin? not same origin but downloads as 'link')
        // Enhanced: fetch as blob to force download with custom name.
        showToast("⬇️ Preparing download...", 800);
        const response = await fetch(currentImageUrl);
        if (!response.ok) throw new Error("Network error");
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = blobUrl;
        // generate filename based on prompt
        let filename = "ai-vision.jpg";
        const promptPrefix = promptInput.value.trim().slice(0, 30).replace(/[^a-z0-9]/gi, '_');
        if (promptPrefix) filename = `visionforge_${promptPrefix}.jpg`;
        else filename = `visionforge_${Date.now()}.jpg`;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(blobUrl);
        showToast("✅ Image saved to your device", 2000);
      } catch (err) {
        console.warn("Blob download failed, fallback to direct link");
        // fallback: use anchor with download attribute (may open in browser if cross-origin policy)
        const fallbackLink = document.createElement('a');
        fallbackLink.href = currentImageUrl;
        fallbackLink.download = "ai_artwork.jpg";
        fallbackLink.target = "_blank";
        document.body.appendChild(fallbackLink);
        fallbackLink.click();
        document.body.removeChild(fallbackLink);
        showToast("📸 Download started (if new tab opens, right-click image)", 2000);
      }
    });

    // Clear button: reset prompt, reset image UI and set empty state
    clearBtn.addEventListener('click', () => {
      promptInput.value = '';
      updateCharCount();
      generatedImage.style.display = 'none';
      currentImageUrl = '';
      downloadBtn.disabled = true;
      downloadBtn.style.opacity = '0.5';
      showEmptyStateWithMessage("🧼 Cleared! Type a new idea.");
      loaderDiv.style.display = 'none';
      promptInput.focus();
      showToast("Interface reset. Ready for fresh inspiration.", 1200);
    });

    // if image fails while loading separately (edge), handle error
    generatedImage.addEventListener('error', () => {
      if (isGenerating) {
        setLoading(false);
        showEmptyStateWithMessage("⚠️ Image broken or API error. Retry with different prompt.");
        downloadBtn.disabled = true;
        downloadBtn.style.opacity = '0.5';
        showToast("Generation failed, try simpler prompt", 2000);
      }
    });

    // initial state: empty
    showEmptyStateWithMessage(null);
    downloadBtn.disabled = true;
    downloadBtn.style.opacity = '0.5';
    // Optional: example default placeholder prompt
    promptInput.placeholder = "✨ mystical forest with glowing waterfalls, digital art, 8K";
  })();
</script>
</body>
</html>
