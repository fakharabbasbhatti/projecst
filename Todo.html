<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Todo App</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Sortable JS for drag-drop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --success-color: #28a745;
            --danger-color: #ff6b6b;
            --warning-color: #ffa502;
            --info-color: #48dbfb;
            --light-bg: #f8f9fa;
            --dark-bg: #1a1a2e;
            --dark-card: #16213e;
            --border-color: #e0e0e0;
            --text-light: #333;
            --text-muted: #666;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
            transition: background 0.3s ease;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        }

        .container-fluid {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* Header Styles */
        .todo-header {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        body.dark-mode .todo-header {
            background: rgba(22, 33, 62, 0.95);
            color: #fff;
        }

        .header-content h1 {
            color: #667eea;
            font-weight: 700;
            margin-bottom: 5px;
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        body.dark-mode .header-content h1 {
            color: #48dbfb;
        }

        .header-content p {
            color: #666;
            font-size: 1rem;
            margin-bottom: 0;
        }

        body.dark-mode .header-content p {
            color: #aaa;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-theme {
            background: #f0f0f0;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .btn-theme:hover {
            background: #e0e0e0;
            transform: scale(1.1);
        }

        body.dark-mode .btn-theme {
            background: #302b63;
            color: #fff;
        }

        body.dark-mode .btn-theme:hover {
            background: #424666;
        }

        /* Input Section */
        .input-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        body.dark-mode .input-section {
            background: rgba(22, 33, 62, 0.95);
        }

        .input-group-custom {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 10px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .input-group-custom {
                grid-template-columns: 1fr;
            }
        }

        .form-input {
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fff;
            color: #333;
        }

        body.dark-mode .form-input {
            background: #1a1a2e;
            border-color: #444;
            color: #fff;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 12px rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }

        .form-select {
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            background: #fff;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        body.dark-mode .form-select {
            background: #1a1a2e;
            border-color: #444;
            color: #fff;
        }

        .form-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 12px rgba(102, 126, 234, 0.3);
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-add:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .btn-add:active {
            transform: translateY(-1px);
        }

        /* Filter Section */
        .filter-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        body.dark-mode .filter-section {
            background: rgba(22, 33, 62, 0.95);
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            background: #fff;
            color: #333;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        body.dark-mode .filter-btn {
            background: #1a1a2e;
            border-color: #444;
            color: #aaa;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        /* Todo List */
        .todo-list-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            max-height: 700px;
            overflow-y: auto;
        }

        body.dark-mode .todo-list-section {
            background: rgba(22, 33, 62, 0.95);
        }

        .todo-list-section::-webkit-scrollbar {
            width: 8px;
        }

        .todo-list-section::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 10px;
        }

        body.dark-mode .todo-list-section::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        .todo-list-section::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .todo-list-section::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px 60px;
        }

        .empty-icon {
            font-size: 4rem;
            color: #ddd;
            margin-bottom: 20px;
        }

        body.dark-mode .empty-icon {
            color: #444;
        }

        .empty-message {
            color: #999;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .empty-submessage {
            color: #bbb;
            font-size: 1rem;
        }

        /* Todo Item */
        .todo-item {
            background: #f8f9fa;
            padding: 16px 18px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.3s ease;
            border-left: 4px solid #667eea;
            cursor: grab;
            position: relative;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        body.dark-mode .todo-item {
            background: #1a1a2e;
        }

        .todo-item:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.15);
        }

        .todo-item.completed {
            opacity: 0.6;
            border-left-color: #28a745;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }

        .todo-item.drag-over {
            opacity: 0.5;
        }

        .todo-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #667eea;
            flex-shrink: 0;
        }

        .drag-handle {
            color: #bbb;
            cursor: grab;
            font-size: 1.2rem;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .todo-item:hover .drag-handle {
            color: #667eea;
        }

        .todo-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        .todo-text {
            color: #333;
            font-size: 1rem;
            word-break: break-word;
            transition: all 0.3s ease;
        }

        body.dark-mode .todo-text {
            color: #e0e0e0;
        }

        .todo-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            font-size: 0.85rem;
        }

        .todo-time {
            color: #999;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        body.dark-mode .todo-time {
            color: #666;
        }

        .todo-priority {
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
        }

        .priority-high {
            background: #ff6b6b;
            color: white;
        }

        .priority-medium {
            background: #ffa502;
            color: white;
        }

        .priority-low {
            background: #48dbfb;
            color: #000;
        }

        .priority-urgent {
            background: #ff4757;
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .todo-category {
            padding: 4px 12px;
            border-radius: 20px;
            background: #e0e7ff;
            color: #667eea;
            font-weight: 600;
            font-size: 0.8rem;
        }

        body.dark-mode .todo-category {
            background: #302b63;
            color: #48dbfb;
        }

        .todo-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            border-radius: 8px;
            color: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-edit:hover {
            background: rgba(102, 126, 234, 0.15);
            transform: scale(1.1);
        }

        .btn-delete {
            color: #ff6b6b;
        }

        .btn-delete:hover {
            background: rgba(255, 107, 107, 0.15);
            transform: scale(1.1);
        }

        .btn-duplicate {
            color: #48dbfb;
        }

        .btn-duplicate:hover {
            background: rgba(72, 219, 251, 0.15);
            transform: scale(1.1);
        }

        /* Stats Section */
        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        body.dark-mode .stat-card {
            background: rgba(22, 33, 62, 0.95);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(102, 126, 234, 0.25);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            color: #667eea;
        }

        .stat-card:nth-child(2) .stat-icon {
            color: #28a745;
        }

        .stat-card:nth-child(3) .stat-icon {
            color: #ffa502;
        }

        .stat-card:nth-child(4) .stat-icon {
            color: #48dbfb;
        }

        .stat-number {
            font-size: 2.8rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 8px;
        }

        .stat-card:nth-child(2) .stat-number {
            color: #28a745;
        }

        .stat-card:nth-child(3) .stat-number {
            color: #ffa502;
        }

        .stat-card:nth-child(4) .stat-number {
            color: #48dbfb;
        }

        body.dark-mode .stat-number,
        body.dark-mode .stat-card:nth-child(2) .stat-number,
        body.dark-mode .stat-card:nth-child(3) .stat-number,
        body.dark-mode .stat-card:nth-child(4) .stat-number {
            color: inherit;
        }

        .stat-label {
            color: #666;
            font-size: 1rem;
            font-weight: 600;
        }

        body.dark-mode .stat-label {
            color: #aaa;
        }

        /* Modal Styles */
        .modal-content {
            background: rgba(255, 255, 255, 0.98);
            border: 2px solid #e0e0e0;
            border-radius: 15px;
        }

        body.dark-mode .modal-content {
            background: rgba(22, 33, 62, 0.98);
            border-color: #444;
            color: #fff;
        }

        .modal-header {
            border-bottom: 2px solid #e0e0e0;
            padding: 20px 25px;
        }

        body.dark-mode .modal-header {
            border-bottom-color: #444;
        }

        .modal-body {
            padding: 25px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 10px 25px;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .todo-header {
                flex-direction: column;
                text-align: center;
                padding: 25px 20px;
            }

            .header-content h1 {
                font-size: 2rem;
            }

            .header-controls {
                justify-content: center;
            }

            .input-group-custom {
                grid-template-columns: 1fr;
            }

            .filter-section {
                justify-content: center;
            }

            .todo-item {
                padding: 14px 12px;
            }

            .todo-actions {
                gap: 6px;
            }

            .btn-icon {
                padding: 6px 8px;
                font-size: 0.9rem;
            }

            .stats-section {
                grid-template-columns: 1fr;
            }

            .todo-meta {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 576px) {
            .container-fluid {
                padding: 0 10px;
            }

            .todo-header {
                padding: 20px 15px;
            }

            .header-content h1 {
                font-size: 1.8rem;
            }

            .input-section,
            .filter-section,
            .todo-list-section,
            .stat-card {
                padding: 20px 15px;
                border-radius: 15px;
            }

            .todo-item {
                padding: 12px 10px;
                gap: 10px;
            }

            .todo-checkbox {
                width: 20px;
                height: 20px;
            }

            .drag-handle {
                font-size: 1rem;
            }

            .todo-text {
                font-size: 0.95rem;
            }

            .stat-number {
                font-size: 2.2rem;
            }

            .stat-icon {
                font-size: 2rem;
            }
        }

        /* Toast Notification */
        .toast-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: slideInUp 0.4s ease;
            z-index: 1000;
            max-width: 300px;
        }

        @keyframes slideInUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideOutDown {
            from {
                transform: translateY(0);
                opacity: 1;
            }
            to {
                transform: translateY(100px);
                opacity: 0;
            }
        }

        .toast-notification.hide {
            animation: slideOutDown 0.4s ease forwards;
        }

        /* Loading Animation */
        .spinner {
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- Header -->
        <div class="todo-header">
            <div class="header-content">
                <h1><i class="fas fa-tasks"></i> My Todos</h1>
                <p>Stay organized and productive 📝</p>
            </div>
            <div class="header-controls">
                <button class="btn-theme" onclick="toggleTheme()" title="Toggle Dark Mode">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="btn-theme" onclick="clearCompleted()" title="Clear Completed">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <div class="input-group-custom">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="form-input"
                    placeholder="Add a new task... (Press Enter)"
                    autocomplete="off"
                >
                <select id="categorySelect" class="form-select">
                    <option value="">Category</option>
                    <option value="work">Work</option>
                    <option value="personal">Personal</option>
                    <option value="shopping">Shopping</option>
                    <option value="health">Health</option>
                </select>
                <select id="prioritySelect" class="form-select">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                    <option value="urgent">Urgent</option>
                </select>
                <button class="btn-add" onclick="addTodo()">
                    <i class="fas fa-plus"></i> Add
                </button>
            </div>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <button class="filter-btn active" onclick="filterTodos('all')">
                <i class="fas fa-list"></i> All
            </button>
            <button class="filter-btn" onclick="filterTodos('active')">
                <i class="fas fa-circle-notch"></i> Active
            </button>
            <button class="filter-btn" onclick="filterTodos('completed')">
                <i class="fas fa-check-circle"></i> Completed
            </button>
            <button class="filter-btn" onclick="filterTodos('high')">
                <i class="fas fa-star"></i> High Priority
            </button>
            <button class="filter-btn" onclick="filterTodos('urgent')">
                <i class="fas fa-exclamation-circle"></i> Urgent
            </button>
        </div>

        <!-- Stats Section -->
        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-tasks"></i></div>
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-check"></i></div>
                <div class="stat-number" id="completedCount">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-hourglass-half"></i></div>
                <div class="stat-number" id="pendingCount">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-fire"></i></div>
                <div class="stat-number" id="completionRate">0%</div>
                <div class="stat-label">Completion</div>
            </div>
        </div>

        <!-- Todo List -->
        <div class="todo-list-section" id="todoList">
            <div class="empty-state">
                <div class="empty-icon"><i class="fas fa-inbox"></i></div>
                <div class="empty-message">No tasks yet</div>
                <div class="empty-submessage">Add your first task to get started!</div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-edit"></i> Edit Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" class="form-input" id="editInput" placeholder="Task description">
                    <select class="form-select mt-3" id="editCategory">
                        <option value="">Category</option>
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                        <option value="shopping">Shopping</option>
                        <option value="health">Health</option>
                    </select>
                    <select class="form-select mt-3" id="editPriority">
                        <option value="low">Low Priority</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                        <option value="urgent">Urgent</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <script>
        // Variables
        let todos = JSON.parse(localStorage.getItem('todos')) || [];
        let editingId = -1;
        let currentFilter = 'all';
        let isDarkMode = localStorage.getItem('darkMode') === 'true';

        // DOM Elements
        const todoInput = document.getElementById('todoInput');
        const todoList = document.getElementById('todoList');
        const categorySelect = document.getElementById('categorySelect');
        const prioritySelect = document.getElementById('prioritySelect');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
            }
            renderTodos();
            setupEventListeners();
        });

        // Event Listeners
        function setupEventListeners() {
            todoInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTodo();
            });

            todoInput.addEventListener('focus', () => {
                todoInput.style.boxShadow = '0 0 12px rgba(102, 126, 234, 0.3)';
            });
        }

        // Toggle Dark Mode
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', isDarkMode);
            showToast('Theme changed successfully! 🌙');
        }

        // Add Todo
        function addTodo() {
            const text = todoInput.value.trim();
            if (!text) {
                showToast('Please enter a task', 'error');
                return;
            }

            const todo = {
                id: Date.now(),
                text: text,
                completed: false,
                priority: prioritySelect.value,
                category: categorySelect.value,
                createdAt: new Date()
            };

            todos.unshift(todo);
            saveTodos();
            renderTodos();
            todoInput.value = '';
            categorySelect.value = '';
            prioritySelect.value = 'medium';
            todoInput.focus();
            showToast('Task added successfully! ✓');
        }

        // Delete Todo
        function deleteTodo(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                todos = todos.filter(t => t.id !== id);
                saveTodos();
                renderTodos();
                showToast('Task deleted', 'info');
            }
        }

        // Toggle Todo
        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                saveTodos();
                renderTodos();
                showToast(todo.completed ? 'Task completed! 🎉' : 'Task marked as pending');
            }
        }

        // Duplicate Todo
        function duplicateTodo(id) {
            const originalTodo = todos.find(t => t.id === id);
            if (originalTodo) {
                const newTodo = { ...originalTodo, id: Date.now() };
                todos.unshift(newTodo);
                saveTodos();
                renderTodos();
                showToast('Task duplicated!');
            }
        }

        // Open Edit Modal
        function openEditModal(id) {
            editingId = id;
            const todo = todos.find(t => t.id === id);
            document.getElementById('editInput').value = todo.text;
            document.getElementById('editCategory').value = todo.category;
            document.getElementById('editPriority').value = todo.priority;
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        // Save Edit
        function saveEdit() {
            const todo = todos.find(t => t.id === editingId);
            const newText = document.getElementById('editInput').value.trim();
            
            if (!newText) {
                showToast('Task cannot be empty', 'error');
                return;
            }

            todo.text = newText;
            todo.category = document.getElementById('editCategory').value;
            todo.priority = document.getElementById('editPriority').value;
            saveTodos();
            renderTodos();
            bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
            showToast('Task updated! ✓');
        }

        // Filter Todos
        function filterTodos(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.filter-btn').classList.add('active');
            renderTodos();
        }

        // Clear Completed
        function clearCompleted() {
            const completedCount = todos.filter(t => t.completed).length;
            if (completedCount === 0) {
                showToast('No completed tasks to clear', 'info');
                return;
            }
            if (confirm(`Delete ${completedCount} completed task(s)?`)) {
                todos = todos.filter(t => !t.completed);
                saveTodos();
                renderTodos();
                showToast(`${completedCount} tasks cleared!`);
            }
        }

        // Get Priority Badge
        function getPriorityBadge(priority) {
            const badges = {
                'urgent': '<span class="todo-priority priority-urgent"><i class="fas fa-exclamation"></i> Urgent</span>',
                'high': '<span class="todo-priority priority-high"><i class="fas fa-arrow-up"></i> High</span>',
                'medium': '<span class="todo-priority priority-medium"><i class="fas fa-minus"></i> Medium</span>',
                'low': '<span class="todo-priority priority-low"><i class="fas fa-arrow-down"></i> Low</span>'
            };
            return badges[priority] || '';
        }

        // Get Category Badge
        function getCategoryBadge(category) {
            if (!category) return '';
            const icons = {
                'work': 'briefcase',
                'personal': 'user',
                'shopping': 'shopping-bag',
                'health': 'heart'
            };
            return `<span class="todo-category"><i class="fas fa-${icons[category] || 'tag'}"></i> ${category.charAt(0).toUpperCase() + category.slice(1)}</span>`;
        }

        // Format Time
        function formatTime(date) {
            const now = new Date();
            const todoDate = new Date(date);
            const diffTime = Math.abs(now - todoDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return `${diffDays}d ago`;
            return todoDate.toLocaleDateString();
        }

        // Get Filtered Todos
        function getFilteredTodos() {
            switch(currentFilter) {
                case 'active':
                    return todos.filter(t => !t.completed);
                case 'completed':
                    return todos.filter(t => t.completed);
                case 'high':
                    return todos.filter(t => t.priority === 'high' && !t.completed);
                case 'urgent':
                    return todos.filter(t => t.priority === 'urgent' && !t.completed);
                default:
                    return todos;
            }
        }

        // Render Todos
        function renderTodos() {
            const filteredTodos = getFilteredTodos();

            if (filteredTodos.length === 0) {
                todoList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-inbox"></i></div>
                        <div class="empty-message">No tasks found</div>
                        <div class="empty-submessage">
                            ${currentFilter === 'all' ? 'Add your first task to get started!' : 'Try adjusting your filter'}
                        </div>
                    </div>
                `;
                updateStats();
                return;
            }

            todoList.innerHTML = filteredTodos.map(todo => `
                <div class="todo-item ${todo.completed ? 'completed' : ''}" draggable="true" ondragstart="dragStart(event)" ondrop="dragDrop(event, ${todo.id})" ondragover="dragOver(event)">
                    <div class="drag-handle">
                        <i class="fas fa-grip-vertical"></i>
                    </div>
                    <input 
                        type="checkbox" 
                        class="todo-checkbox" 
                        ${todo.completed ? 'checked' : ''}
                        onchange="toggleTodo(${todo.id})"
                    >
                    <div class="todo-content">
                        <div class="todo-text">${escapeHtml(todo.text)}</div>
                        <div class="todo-meta">
                            ${getPriorityBadge(todo.priority)}
                            ${getCategoryBadge(todo.category)}
                            <span class="todo-time"><i class="fas fa-clock"></i> ${formatTime(todo.createdAt)}</span>
                        </div>
                    </div>
                    <div class="todo-actions">
                        <button class="btn-icon btn-duplicate" onclick="duplicateTodo(${todo.id})" title="Duplicate">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button class="btn-icon btn-edit" onclick="openEditModal(${todo.id})" title="Edit">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-icon btn-delete" onclick="deleteTodo(${todo.id})" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            updateStats();
        }

        // Update Stats
        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            const pending = total - completed;
            const rate = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById('totalCount').textContent = total;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('completionRate').textContent = rate + '%';
        }

        // Save Todos
        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Show Toast
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // Drag and Drop
        let draggedId = null;

        function dragStart(event) {
            draggedId = event.currentTarget.dataset.id;
            event.currentTarget.style.opacity = '0.5';
        }

        function dragOver(event) {
            event.preventDefault();
            event.currentTarget.classList.add('drag-over');
        }

        function dragDrop(event, targetId) {
            event.preventDefault();
            event.currentTarget.classList.remove('drag-over');
            
            if (draggedId && draggedId !== targetId.toString()) {
                const draggedIndex = todos.findIndex(t => t.id === parseInt(draggedId));
                const targetIndex = todos.findIndex(t => t.id === targetId);
                
                if (draggedIndex > -1 && targetIndex > -1) {
                    [todos[draggedIndex], todos[targetIndex]] = [todos[targetIndex], todos[draggedIndex]];
                    saveTodos();
                    renderTodos();
                }
            }
            draggedId = null;
        }
    </script>
</body>
</html>
