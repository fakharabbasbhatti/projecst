
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nokia Mobile Design</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .mobile {
      width: 320px;
      background: #111827;
      border-radius: 35px;
      padding: 18px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      border: 4px solid #374151;
    }

    .screen {
      background: linear-gradient(180deg, #1d4ed8, #2563eb);
      border-radius: 20px;
      height: 520px;
      overflow: hidden;
      position: relative;
      color: white;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      font-size: 14px;
    }

    .clock {
      text-align: center;
      margin-top: 40px;
    }

    .clock h1 {
      font-size: 60px;
      font-weight: bold;
      margin: 0;
    }

    .clock p {
      margin-top: 5px;
      font-size: 18px;
    }

    .apps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 35px 20px;
    }

    .app {
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .app:hover {
      transform: scale(1.1);
    }

    .app i {
      width: 65px;
      height: 65px;
      line-height: 65px;
      border-radius: 18px;
      font-size: 28px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(6px);
    }

    .app span {
      display: block;
      margin-top: 8px;
      font-size: 14px;
    }

    .bottom-nav {
      position: absolute;
      bottom: 15px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      font-size: 22px;
    }

    .bottom-nav i {
      cursor: pointer;
      transition: 0.3s;
    }

    .bottom-nav i:hover {
      color: #facc15;
      transform: scale(1.2);
    }

    .nokia-logo {
      text-align: center;
      color: white;
      font-size: 28px;
      font-weight: bold;
      margin-top: 15px;
      letter-spacing: 4px;
    }
  </style>
</head>
<body>

  <div class="mobile">
    <div class="screen">

      <div class="top-bar">
        <span><i class="fa-solid fa-signal"></i> 5G</span>
        <span><i class="fa-solid fa-battery-full"></i> 98%</span>
      </div>

      <div class="clock">
        <h1 id="time">12:00</h1>
        <p id="date">Monday, 1 January</p>
      </div>

      <div class="apps">
        <div class="app">
          <i class="fa-solid fa-phone"></i>
          <span>Call</span>
        </div>

        <div class="app">
          <i class="fa-solid fa-message"></i>
          <span>SMS</span>
        </div>

        <div class="app">
          <i class="fa-solid fa-camera"></i>
          <span>Camera</span>
        </div>

        <div class="app">
          <i class="fa-solid fa-music"></i>
          <span>Music</span>
        </div>

        <div class="app">
          <i class="fa-solid fa-globe"></i>
          <span>Browser</span>
        </div>

        <div class="app">
          <i class="fa-solid fa-gear"></i>
          <span>Settings</span>
        </div>
      </div>

      <div class="bottom-nav">
        <i class="fa-solid fa-bars"></i>
        <i class="fa-solid fa-house"></i>
        <i class="fa-solid fa-arrow-left"></i>
      </div>
    </div>

    <div class="nokia-logo">NOKIA</div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function updateClock() {
      const now = new Date();

      let hours = now.getHours();
      let minutes = now.getMinutes();

      hours = hours < 10 ? '0' + hours : hours;
      minutes = minutes < 10 ? '0' + minutes : minutes;

      document.getElementById('time').innerHTML = `${hours}:${minutes}`;

      const options = {
        weekday: 'long',
        day: 'numeric',
        month: 'long'
      };

      document.getElementById('date').innerHTML = now.toLocaleDateString('en-US', options);
    }

    updateClock();
    setInterval(updateClock, 1000);

    const apps = document.querySelectorAll('.app');

    apps.forEach(app => {
      app.addEventListener('click', () => {
        alert(app.innerText + ' Opened');
      });
    });
  </script>

</body>
</html>
