<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nokia Premium Edition</title>

  <!-- Bootstrap & Google Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --nokia-blue: #005AFF;
      --glass: rgba(255, 255, 255, 0.15);
      --border: rgba(255, 255, 255, 0.2);
    }

    body {
      background: #020617;
      background-image: radial-gradient(circle at 20% 30%, #1e293b 0%, #020617 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      margin: 0;
    }

    /* Mobile Frame */
    .mobile {
      width: 340px;
      background: #0f172a;
      border-radius: 50px;
      padding: 12px;
      box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(255,255,255,0.1);
      border: 2px solid #334155;
      position: relative;
    }

    /* Hardware Buttons */
    .mobile::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 120px;
      width: 4px;
      height: 100px;
      background: #334155;
      border-radius: 0 5px 5px 0;
      box-shadow: 2px 0 5px rgba(0,0,0,0.5);
    }

    /* Screen Context */
    .screen {
      background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') no-repeat center center;
      background-size: cover;
      border-radius: 40px;
      height: 650px;
      overflow: hidden;
      position: relative;
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Overlay for readability */
    .screen-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.2);
      z-index: 1;
    }

    .content-layer {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      padding: 15px 25px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .clock {
      text-align: center;
      margin-top: 50px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .clock h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 64px;
      margin: 0;
    }

    .clock p {
      font-weight: 300;
      opacity: 0.9;
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      padding: 40px 25px;
      margin-top: auto;
      margin-bottom: 80px;
    }

    .app-item {
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .app-icon {
      width: 65px;
      height: 65px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin: 0 auto 8px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .app-item:hover { transform: translateY(-8px); }
    .app-item:hover .app-icon { background: var(--nokia-blue); border-color: transparent; }

    .app-item span {
      font-size: 12px;
      font-weight: 400;
      display: block;
    }

    .bottom-nav {
      position: absolute;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 40px;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: 0.3s;
      color: rgba(255,255,255,0.7);
    }

    .nav-btn:hover {
      background: var(--glass);
      color: white;
    }

    .nokia-branding {
      text-align: center;
      color: #94a3b8;
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      letter-spacing: 6px;
      padding: 15px 0 10px;
    }
  </style>
</head>
<body>

  <div class="mobile">
    <div class="screen">
      <div class="screen-overlay"></div>
      
      <div class="content-layer">
        <div class="top-bar">
          <span><i class="fa-solid fa-signal"></i> 5G</span>
          <span>11:26 <i class="fa-solid fa-battery-three-quarters ms-1"></i></span>
        </div>

        <div class="clock">
          <h1 id="time">12:00</h1>
          <p id="date">Monday, May 9</p>
        </div>

        <div class="apps-grid">
          <div class="app-item" onclick="openApp('Dialer')">
            <div class="app-icon"><i class="fa-solid fa-phone"></i></div>
            <span>Phone</span>
          </div>
          <div class="app-item" onclick="openApp('Messages')">
            <div class="app-icon" style="background: rgba(34, 197, 94, 0.2);"><i class="fa-solid fa-comment"></i></div>
            <span>Chat</span>
          </div>
          <div class="app-item" onclick="openApp('Gallery')">
            <div class="app-icon" style="background: rgba(168, 85, 247, 0.2);"><i class="fa-solid fa-images"></i></div>
            <span>Photos</span>
          </div>
          <div class="app-item" onclick="openApp('Spotify')">
            <div class="app-icon"><i class="fa-solid fa-music"></i></div>
            <span>Music</span>
          </div>
          <div class="app-item" onclick="openApp('Chrome')">
            <div class="app-icon"><i class="fa-solid fa-globe"></i></div>
            <span>Web</span>
          </div>
          <div class="app-item" onclick="openApp('Settings')">
            <div class="app-icon"><i class="fa-solid fa-sliders"></i></div>
            <span>Setup</span>
          </div>
        </div>

        <div class="bottom-nav">
          <div class="nav-btn"><i class="fa-solid fa-chevron-left"></i></div>
          <div class="nav-btn"><i class="fa-solid fa-circle"></i></div>
          <div class="nav-btn"><i class="fa-solid fa-square"></i></div>
        </div>
      </div>
    </div>

    <div class="nokia-branding">NOKIA</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('time').innerText = `${h}:${m}`;
      
      const options = { weekday: 'long', month: 'long', day: 'numeric' };
      document.getElementById('date').innerText = now.toLocaleDateString('en-US', options);
    }

    function openApp(name) {
      console.log(`Launching ${name}...`);
      // Add haptic feedback simulation or transition here
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
