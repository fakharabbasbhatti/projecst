<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia Pro OS</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --accent-color: #0078ff;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #050505;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Mobile Chassis */
        .phone-frame {
            width: 360px;
            height: 740px;
            background: #1a1a1a;
            border-radius: 55px;
            padding: 12px;
            position: relative;
            box-shadow: 0 0 0 4px #333, 0 30px 60px rgba(0,0,0,0.8);
            border: 1px solid #444;
        }

        /* Hardware Details */
        .power-btn {
            position: absolute;
            right: -3px; top: 180px;
            width: 3px; height: 60px;
            background: #444; border-radius: 0 3px 3px 0;
        }

        /* Screen with animated background */
        .screen {
            width: 100%;
            height: 100%;
            border-radius: 45px;
            overflow: hidden;
            position: relative;
            background: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&q=80&w=1000');
            background-size: 110% 110%;
            animation: bgMove 20s infinite alternate linear;
        }

        @keyframes bgMove {
            from { background-position: 0% 0%; }
            to { background-position: 100% 100%; }
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, transparent 40%, rgba(0,0,0,0.7) 100%);
            z-index: 1;
        }

        /* UI Content Layer */
        .ui-wrapper {
            position: relative;
            z-index: 2;
            height: 100%;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar Enhancements */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            color: white;
            padding: 5px 10px;
        }

        /* Large Clock Section */
        .hero-clock {
            margin-top: 40px;
            text-align: left;
            padding-left: 10px;
        }

        .hero-clock h1 {
            font-size: 72px;
            font-weight: 200;
            letter-spacing: -2px;
            margin: 0;
            line-height: 1;
        }

        .hero-clock p {
            font-size: 18px;
            font-weight: 400;
            opacity: 0.8;
            margin-top: 5px;
        }

        /* Modern Apps Layout */
        .app-shelf {
            margin-top: auto;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 20px 10px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid var(--glass-border);
        }

        .app-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .app-box:active { transform: scale(0.9); }

        .app-icon {
            width: 55px;
            height: 55px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .app-box span { font-size: 11px; font-weight: 500; opacity: 0.9; }

        /* Dock (Bottom Favorite Apps) */
        .dock {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            margin-bottom: 5px;
        }

        .dock-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
        }

        /* Navigation Pill */
        .nav-pill {
            width: 120px;
            height: 5px;
            background: white;
            border-radius: 10px;
            margin: 0 auto 5px;
            opacity: 0.6;
        }

        .nokia-logo {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            color: #444;
            font-weight: 700;
            letter-spacing: 5px;
        }

    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="power-btn"></div>
        
        <div class="screen">
            <div class="overlay"></div>
            
            <div class="ui-wrapper">
                <!-- Status Bar -->
                <div class="status-bar">
                    <div class="left-status">
                        <i class="fa-solid fa-wifi me-1"></i>
                        <span>Nokia 5G</span>
                    </div>
                    <div class="right-status">
                        <i class="fa-solid fa-bluetooth-b me-2 opacity-50"></i>
                        <span class="me-1">85%</span>
                        <i class="fa-solid fa-battery-three-quarters"></i>
                    </div>
                </div>

                <!-- Clock Section -->
                <div class="hero-clock">
                    <h1 id="time">00:00</h1>
                    <p id="date">Friday, May 9</p>
                </div>

                <!-- Main Apps Grid -->
                <div class="app-shelf">
                    <div class="app-box">
                        <div class="app-icon" style="background: linear-gradient(135deg, #FF512F, #DD2476);"><i class="fa-solid fa-envelope"></i></div>
                        <span>Mail</span>
                    </div>
                    <div class="app-box">
                        <div class="app-icon" style="background: linear-gradient(135deg, #1D976C, #93F9B9);"><i class="fa-solid fa-calendar-days"></i></div>
                        <span>Calendar</span>
                    </div>
                    <div class="app-box">
                        <div class="app-icon" style="background: #1DA1F2;"><i class="fa-brands fa-twitter"></i></div>
                        <span>Social</span>
                    </div>
                    <div class="app-box">
                        <div class="app-icon" style="background: #FF0000;"><i class="fa-brands fa-youtube"></i></div>
                        <span>Videos</span>
                    </div>
                </div>

                <!-- Dock Favorites -->
                <div class="dock">
                    <div class="dock-icon"><i class="fa-solid fa-phone-flip text-success"></i></div>
                    <div class="dock-icon"><i class="fa-solid fa-message text-info"></i></div>
                    <div class="dock-icon"><i class="fa-solid fa-camera"></i></div>
                    <div class="dock-icon" style="background: white;"><i class="fa-brands fa-chrome text-primary"></i></div>
                </div>

                <div class="nav-pill"></div>
            </div>
        </div>
        
        <div class="nokia-logo">NOKIA</div>
    </div>

    <script>
        function updateDisplay() {
            const now = new Date();
            
            // Update Time
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time').innerText = `${hours}:${minutes}`;

            // Update Date
            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', options);
        }

        // Add Click Sound/Vibration simulation
        document.querySelectorAll('.app-box, .dock-icon').forEach(item => {
            item.addEventListener('click', () => {
                // Flash effect
                item.style.opacity = '0.5';
                setTimeout(() => item.style.opacity = '1', 100);
                console.log("App Launched: " + item.querySelector('span')?.innerText || 'System App');
            });
        });

        setInterval(updateDisplay, 1000);
        updateDisplay();
    </script>
</body>
</html>
