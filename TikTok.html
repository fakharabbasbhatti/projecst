<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Clone UI</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }

    .top-header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }

    .top-header h4 {
      font-size: 18px;
      margin: 0;
      font-weight: bold;
    }

    .video-container {
      height: 100vh;
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
    }

    .video-container::-webkit-scrollbar {
      display: none;
    }

    .video-card {
      position: relative;
      height: 100vh;
      scroll-snap-align: start;
      display: flex;
      align-items: end;
      justify-content: space-between;
      padding: 20px;
      background-size: cover;
      background-position: center;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.1));
    }

    .video-info {
      position: relative;
      z-index: 2;
      width: 75%;
      margin-bottom: 80px;
    }

    .video-info h5 {
      font-weight: bold;
    }

    .video-info p {
      font-size: 14px;
      margin-top: 8px;
    }

    .side-icons {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-bottom: 100px;
    }

    .icon-box {
      text-align: center;
      cursor: pointer;
    }

    .icon-box i {
      font-size: 28px;
      margin-bottom: 5px;
      transition: 0.3s;
    }

    .icon-box i:hover {
      transform: scale(1.2);
      color: #ff0050;
    }

    .icon-box span {
      font-size: 13px;
      display: block;
    }

    .profile-img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #fff;
      object-fit: cover;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #111;
      border-top: 1px solid rgba(255,255,255,0.1);
      z-index: 1000;
      padding: 8px 0;
    }

    .bottom-nav .nav-item {
      text-align: center;
      color: #fff;
      flex: 1;
      cursor: pointer;
      transition: 0.3s;
    }

    .bottom-nav .nav-item:hover {
      color: #ff0050;
    }

    .bottom-nav i {
      font-size: 22px;
      display: block;
      margin-bottom: 3px;
    }

    .create-btn {
      background: linear-gradient(45deg, #25f4ee, #fe2c55);
      padding: 8px 14px;
      border-radius: 10px;
      color: #fff;
    }

    .music {
      animation: rotate 5s linear infinite;
      border-radius: 50%;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @media(max-width: 768px) {
      .video-info {
        width: 65%;
      }

      .icon-box i {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="top-header d-flex justify-content-between align-items-center">
    <i class="fa-solid fa-bars fs-4"></i>
    <h4>Following | <span class="text-danger">For You</span></h4>
    <i class="fa-solid fa-magnifying-glass fs-4"></i>
  </div>

  <!-- Videos -->
  <div class="video-container">

    <!-- Video 1 -->
    <div class="video-card" style="background-image:url('https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=1200&auto=format&fit=crop');">
      <div class="overlay"></div>

      <div class="video-info">
        <h5>@creative_girl</h5>
        <p>Enjoying beautiful moments ✨ #travel #viral</p>
        <small><i class="fa-solid fa-music"></i> Trending Sound - TikTok Remix</small>
      </div>

      <div class="side-icons">
        <img src="https://randomuser.me/api/portraits/women/44.jpg" class="profile-img" alt="profile">

        <div class="icon-box like-btn">
          <i class="fa-solid fa-heart"></i>
          <span class="like-count">12.5K</span>
        </div>

        <div class="icon-box">
          <i class="fa-solid fa-comment-dots"></i>
          <span>890</span>
        </div>

        <div class="icon-box">
          <i class="fa-solid fa-bookmark"></i>
          <span>Save</span>
        </div>

        <div class="icon-box">
          <i class="fa-solid fa-share"></i>
          <span>Share</span>
        </div>

        <img src="https://cdn-icons-png.flaticon.com/512/727/727245.png" class="profile-img music" alt="music">
      </div>
    </div>

    <!-- Video 2 -->
    <div class="video-card" style="background-image:url('https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=1200&auto=format&fit=crop');">
      <div class="overlay"></div>

      <div class="video-info">
        <h5>@fashion_boy</h5>
        <p>Street style vibes 🔥 #fashion #reels</p>
        <small><i class="fa-solid fa-music"></i> Cool Beat - DJ Mix</small>
      </div>

      <div class="side-icons">
        <img src="https://randomuser.me/api/portraits/men/32.jpg" class="profile-img" alt="profile">

        <div class="icon-box like-btn">
          <i class="fa-solid fa-heart"></i>
          <span class="like-count">9.3K</span>
        </div>

        <div class="icon-box">
          <i class="fa-solid fa-comment-dots"></i>
          <span>420</span>
        </div>

        <div class="icon-box">
          <i class="fa-solid fa-bookmark"></i>
          <span>Save</span>
        </div>

        <div class="icon-box">
          <i class="fa-solid fa-share"></i>
          <span>Share</span>
        </div>

        <img src="https://cdn-icons-png.flaticon.com/512/727/727245.png" class="profile-img music" alt="music">
      </div>
    </div>

  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav d-flex justify-content-around align-items-center">
    <div class="nav-item">
      <i class="fa-solid fa-house"></i>
      <small>Home</small>
    </div>

    <div class="nav-item">
      <i class="fa-solid fa-compass"></i>
      <small>Discover</small>
    </div>

    <div class="nav-item">
      <i class="fa-solid fa-plus create-btn"></i>
    </div>

    <div class="nav-item">
      <i class="fa-solid fa-message"></i>
      <small>Inbox</small>
    </div>

    <div class="nav-item">
      <i class="fa-solid fa-user"></i>
      <small>Profile</small>
    </div>
  </div>


  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Like Button Animation
    document.querySelectorAll('.like-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const icon = btn.querySelector('i');

        if(icon.classList.contains('text-danger')) {
          icon.classList.remove('text-danger');
        } else {
          icon.classList.add('text-danger');
        }
      });
    });

    // Double Click Heart Effect
    document.querySelectorAll('.video-card').forEach(card => {
      card.addEventListener('dblclick', (e) => {
        const heart = document.createElement('i');
        heart.className = 'fa-solid fa-heart';
        heart.style.position = 'absolute';
        heart.style.left = e.clientX - 20 + 'px';
        heart.style.top = e.clientY - 80 + 'px';
        heart.style.fontSize = '80px';
        heart.style.color = '#ff0050';
        heart.style.zIndex = '999';
        heart.style.opacity = '1';
        heart.style.transition = 'all 1s ease';

        card.appendChild(heart);

        setTimeout(() => {
          heart.style.opacity = '0';
          heart.style.transform = 'scale(1.5)';
        }, 100);

        setTimeout(() => {
          heart.remove();
        }, 1000);
