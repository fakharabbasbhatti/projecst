<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikClone - Premium Video Feed</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .container-main { display: flex; height: 100vh; }

        /* Sidebar Improvement */
        .sidebar {
            width: 250px; background: #000; border-right: 1px solid #222;
            padding: 20px 0; position: fixed; height: 100vh; left: 0; top: 0; z-index: 100;
        }

        .sidebar-logo {
            padding: 0 20px 30px; font-size: 24px; font-weight: 800;
            color: #fff; display: flex; align-items: center; gap: 10px;
        }

        .sidebar-nav a {
            display: flex; align-items: center; padding: 12px 20px;
            color: #fff; text-decoration: none; font-size: 18px; font-weight: 600;
        }

        .sidebar-nav a:hover, .sidebar-nav a.active {
            background: rgba(255, 255, 255, 0.1); color: #fe2c55;
        }

        .sidebar-nav i { margin-right: 15px; width: 24px; font-size: 20px; }

        /* Feed with Snap Scrolling */
        .main-content { margin-left: 250px; flex: 1; display: flex; justify-content: center; background: #000; }

        .feed {
            width: 100%; max-width: 500px; height: 100vh;
            overflow-y: scroll; scroll-snap-type: y mandatory; /* Crucial for TikTok feel */
        }

        .feed::-webkit-scrollbar { display: none; }

        .video-item {
            height: 100vh; width: 100%; position: relative;
            scroll-snap-align: start; background: #000;
            display: flex; align-items: center; justify-content: center;
        }

        video {
            width: 100%; height: 100%; object-fit: cover;
        }

        /* Video Overlay UI */
        .video-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.8));
            pointer-events: none;
        }

        .video-overlay * { pointer-events: auto; }

        .user-handle { font-weight: bold; font-size: 17px; margin-bottom: 10px; display: block; }
        .video-desc { font-size: 15px; margin-bottom: 10px; }
        
        /* Floating Actions */
        .actions-sidebar {
            position: absolute; right: 10px; bottom: 100px;
            display: flex; flex-direction: column; align-items: center; gap: 20px;
        }

        .action-item { text-align: center; }
        .action-btn {
            width: 45px; height: 45px; border-radius: 50%;
            background: rgba(255,255,255,0.15); border: none;
            color: white; font-size: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        
        .action-btn.liked { color: #fe2c55; }
        .action-item span { font-size: 12px; margin-top: 5px; display: block; }

        /* Heart Animation on Double Tap */
        .heart-animation {
            position: absolute; font-size: 100px; color: #fe2c55;
            opacity: 0; pointer-events: none; animation: heartFade 0.8s ease-out;
            z-index: 100;
        }

        @keyframes heartFade {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0; transform: scale(1.5); }
        }

        /* Right Suggestions Sidebar (Desktop Only) */
        .suggestions-sidebar {
            width: 350px; padding: 20px; border-left: 1px solid #222;
        }

        @media (max-width: 1024px) {
            .suggestions-sidebar { display: none; }
            .sidebar { width: 80px; }
            .sidebar-nav span, .sidebar-logo span { display: none; }
            .main-content { margin-left: 80px; }
        }
    </style>
</head>
<body>

<div class="container-main">
    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="sidebar-logo">
            <i class="fab fa-tiktok"></i> <span>TikClone</span>
        </div>
        <ul class="sidebar-nav">
            <li><a href="#" class="active"><i class="fas fa-home"></i> <span>For You</span></a></li>
            <li><a href="#"><i class="fas fa-compass"></i> <span>Explore</span></a></li>
            <li><a href="#"><i class="fas fa-video"></i> <span>LIVE</span></a></li>
            <li><a href="#"><i class="far fa-user"></i> <span>Profile</span></a></li>
        </ul>
        <div class="p-3">
            <button class="btn w-100 fw-bold" style="background:#fe2c55; color:white;" id="createBtn">
                <i class="fas fa-plus"></i> <span>Upload</span>
            </button>
        </div>
    </div>

    <!-- Main Feed -->
    <div class="main-content">
        <div class="feed" id="feed">
            <!-- Dynamic Videos Here -->
        </div>
    </div>

    <!-- Right Sidebar -->
    <div class="suggestions-sidebar">
        <h6 class="text-secondary fw-bold mb-3">Suggested Accounts</h6>
        <div id="suggestedUsers"></div>
    </div>
</div>

<script>
    // Real video URLs (Sample samples)
    const videoData = [
        { id: 1, user: '@nature_vibes', desc: 'Beautiful waterfall! 🌊 #nature', likes: '1.2M', music: 'Original Sound', url: 'https://v16-webapp.tiktok.com/...' || 'https://www.w3schools.com/html/mov_bbb.mp4' },
        { id: 2, user: '@chef_pro', desc: 'Best burger recipe ever 🍔 #foodie', likes: '800K', music: 'Cooking Beats', url: 'https://www.w3schools.com/html/movie.mp4' },
        { id: 3, user: '@tech_guru', desc: 'Setup tour 2026 💻 #gaming', likes: '450K', music: 'Lo-Fi Chill', url: 'https://www.w3schools.com/html/mov_bbb.mp4' }
    ];

    const feed = document.getElementById('feed');

    // Create Video Element
    function createVideoItem(data) {
        const item = document.createElement('div');
        item.className = 'video-item';
        item.innerHTML = `
            <video loop src="${data.url}" preload="auto"></video>
            <div class="video-overlay">
                <span class="user-handle">${data.user}</span>
                <p class="video-desc">${data.desc}</p>
                <div class="video-music"><i class="fas fa-music"></i> ${data.music}</div>
            </div>
            <div class="actions-sidebar">
                <div class="action-item">
                    <button class="action-btn like-btn"><i class="fas fa-heart"></i></button>
                    <span>${data.likes}</span>
                </div>
                <div class="action-item">
                    <button class="action-btn"><i class="fas fa-comment-dots"></i></button>
                    <span>2.4K</span>
                </div>
                <div class="action-item">
                    <button class="action-btn"><i class="fas fa-share"></i></button>
                    <span>Share</span>
                </div>
            </div>
        `;

        // Double Click to Like
        item.addEventListener('dblclick', function(e) {
            const heart = document.createElement('i');
            heart.className = 'fas fa-heart heart-animation';
            heart.style.left = `${e.offsetX - 50}px`;
            heart.style.top = `${e.offsetY - 50}px`;
            item.appendChild(heart);
            item.querySelector('.like-btn').classList.add('liked');
            setTimeout(() => heart.remove(), 800);
        });

        // Click to Play/Pause
        const v = item.querySelector('video');
        v.addEventListener('click', () => v.paused ? v.play() : v.pause());

        return item;
    }

    // Load Videos
    videoData.forEach(vid => feed.appendChild(createVideoItem(vid)));

    // Intersection Observer for Auto-Play
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            const video = entry.target.querySelector('video');
            if (entry.isIntersecting) {
                video.play();
            } else {
                video.pause();
                video.currentTime = 0;
            }
        });
    }, { threshold: 0.8 });

    document.querySelectorAll('.video-item').forEach(item => observer.observe(item));

    // Simple Suggestion Generator
    const users = ['ali_fitness', 'zara_style', 'travel_bug'];
    users.forEach(u => {
        document.getElementById('suggestedUsers').innerHTML += `
            <div class="d-flex align-items-center mb-3">
                <div style="width:40px; height:40px; border-radius:50%; background:#444; margin-right:10px"></div>
                <div class="flex-grow-1">
                    <div class="fw-bold" style="font-size:14px">@${u}</div>
                    <div class="text-secondary" style="font-size:12px">Suggested for you</div>
                </div>
                <button class="btn btn-sm btn-outline-danger py-0 px-3 fw-bold">Follow</button>
            </div>
        `;
    });
</script>

</body>
</html>
