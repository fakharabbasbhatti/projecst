<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Pro Max | Complete OS Simulation</title>
    
    <!-- Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <style>
        :root {
            --ios-blue: #007aff;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --bg-url: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop');
        }

        body {
            background: #0f0f0f;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            color: white;
        }

        /* HARDWARE DESIGN */
        .phone-body {
            width: 380px;
            height: 800px;
            background: #111;
            border-radius: 60px;
            padding: 12px;
            border: 4px solid #333;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        /* DYNAMIC ISLAND */
        .island {
            width: 120px;
            height: 35px;
            background: black;
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 20px;
            z-index: 2000;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .island.active { width: 300px; height: 60px; }

        /* SCREEN */
        .screen-container {
            width: 100%;
            height: 100%;
            background: var(--bg-url);
            background-size: cover;
            background-position: center;
            border-radius: 48px;
            position: relative;
            overflow: hidden;
            transition: filter 0.3s;
        }

        /* BOOT SCREEN */
        #boot-screen {
            position: absolute;
            inset: 0;
            background: black;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* HOME SCREEN */
        .status-bar {
            height: 45px;
            padding: 0 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
            margin-top: 20px;
        }

        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }

        .app-icon {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .app:active .app-icon { transform: scale(0.9); }

        /* FULL APP WINDOWS */
        .app-window {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f2f2f7;
            color: black;
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 48px;
            display: flex;
            flex-direction: column;
        }

        .app-window.open { transform: translateY(-100%); }

        .app-header {
            padding: 55px 20px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
        }

        /* SPECIFIC APP STYLES */
        .notes-area { padding: 20px; flex: 1; }
        .note-input { width: 100%; border: none; outline: none; height: 80%; font-size: 18px; background: transparent; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            overflow-y: auto;
        }
        .gallery-img { width: 100%; aspect-ratio: 1; object-fit: cover; }

        /* BOTTOM DOCK */
        .dock {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            height: 90px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(25px);
            border-radius: 35px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            border: 1px solid var(--glass-border);
        }

        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 5px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            z-index: 1100;
        }
    </style>
</head>
<body>

    <div class="phone-body">
        <div class="island" id="island"></div>
        
        <!-- Boot Screen -->
        <div id="boot-screen">
            <i class="fab fa-apple fa-4x mb-4"></i>
            <div class="spinner-border text-light" role="status"></div>
            <p class="mt-3">Nexus OS Loading...</p>
        </div>

        <div class="screen-container" id="screen">
            
            <!-- Status Bar -->
            <div class="status-bar">
                <span id="time-display">12:00</span>
                <div class="d-flex gap-2">
                    <i class="fas fa-signal"></i>
                    <i class="fas fa-wifi"></i>
                    <i class="fas fa-battery-full"></i>
                </div>
            </div>

            <!-- Home App Grid -->
            <div class="app-grid">
                <div class="app" onclick="openApp('app-notes')">
                    <div class="app-icon bg-warning text-white"><i class="fas fa-sticky-note"></i></div>
                    <small>Notes</small>
                </div>
                <div class="app" onclick="openApp('app-gallery')">
                    <div class="app-icon bg-white text-primary"><i class="fas fa-images"></i></div>
                    <small>Photos</small>
                </div>
                <div class="app" onclick="openApp('app-calc')">
                    <div class="app-icon bg-dark text-warning"><i class="fas fa-calculator"></i></div>
                    <small>Calc</small>
                </div>
                <div class="app" onclick="openApp('app-settings')">
                    <div class="app-icon bg-secondary text-white"><i class="fas fa-cog"></i></div>
                    <small>Settings</small>
                </div>
            </div>

            <!-- NOTES APP -->
            <div id="app-notes" class="app-window">
                <div class="app-header">
                    <h4 class="m-0">My Notes</h4>
                    <button class="btn btn-primary btn-sm" onclick="saveNote()">Save</button>
                </div>
                <div class="notes-area">
                    <textarea class="note-input" id="note-text" placeholder="Start typing your ideas..."></textarea>
                    <div id="saved-notes-list" class="mt-3 small text-muted"></div>
                </div>
            </div>

            <!-- GALLERY APP -->
            <div id="app-gallery" class="app-window">
                <div class="app-header">
                    <h4 class="m-0">Library</h4>
                    <i class="fas fa-search"></i>
                </div>
                <div class="gallery-grid">
                    <img src="https://picsum.photos/200/200?random=1" class="gallery-img">
                    <img src="https://picsum.photos/200/200?random=2" class="gallery-img">
                    <img src="https://picsum.photos/200/200?random=3" class="gallery-img">
                    <img src="https://picsum.photos/200/200?random=4" class="gallery-img">
                    <img src="https://picsum.photos/200/200?random=5" class="gallery-img">
                    <img src="https://picsum.photos/200/200?random=6" class="gallery-img">
                </div>
            </div>

            <!-- SETTINGS APP -->
            <div id="app-settings" class="app-window">
                <div class="app-header">
                    <h4 class="m-0">Settings</h4>
                </div>
                <div class="p-3">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            Airplane Mode <div class="form-check form-switch"><input class="form-check-input" type="checkbox"></div>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center" onclick="changeWallpaper()">
                            Change Wallpaper <i class="fas fa-chevron-right"></i>
                        </li>
                        <li class="list-group-item">Storage: 95% Used</li>
                    </ul>
                </div>
            </div>

            <!-- DOCK -->
            <div class="dock">
                <div class="app-icon bg-success text-white"><i class="fas fa-phone"></i></div>
                <div class="app-icon bg-primary text-white"><i class="fas fa-message"></i></div>
                <div class="app-icon bg-info text-white"><i class="fas fa-envelope"></i></div>
                <div class="app-icon bg-danger text-white" style="background: linear-gradient(to right, #ff5f6d, #ffc371);"><i class="fab fa-music"></i></div>
            </div>

            <!-- Home Indicator -->
            <div class="home-indicator" id="home-btn" onclick="closeAllApps()"></div>
        </div>
    </div>

    <!-- SCRIPTING ENGINE -->
    <script>
        // 1. BOOT SEQUENCE
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('boot-screen').style.display = 'none';
                triggerNotification("Welcome to Nexus OS", "Device unlocked successfully.");
            }, 3000);
            loadNotes();
        };

        // 2. TIME ENGINE
        function updateTime() {
            const now = new Date();
            const time = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('time-display').innerText = time;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 3. NAVIGATION LOGIC
        function openApp(id) {
            document.getElementById(id).classList.add('open');
            // Change home indicator color for light apps
            document.getElementById('home-btn').style.background = '#333';
        }

        function closeAllApps() {
            const windows = document.querySelectorAll('.app-window');
            windows.forEach(win => win.classList.remove('open'));
            document.getElementById('home-btn').style.background = 'white';
        }

        // 4. FUNCTIONAL APPS
        // Notes Functionality
        function saveNote() {
            const text = document.getElementById('note-text').value;
            if(text) {
                localStorage.setItem('nexus_note', text);
                triggerNotification("Notes", "Note saved locally.");
                loadNotes();
            }
        }

        function loadNotes() {
            const saved = localStorage.getItem('nexus_note');
            if(saved) {
                document.getElementById('saved-notes-list').innerText = "Last saved: " + saved.substring(0, 20) + "...";
            }
        }

        // Settings - Wallpaper Change
        function changeWallpaper() {
            const screen = document.getElementById('screen');
            screen.style.backgroundImage = "url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=2070&auto=format&fit=crop')";
            triggerNotification("Settings", "Wallpaper updated.");
        }

        // 5. DYNAMIC ISLAND NOTIFICATIONS
        function triggerNotification(title, msg) {
            const island = document.getElementById('island');
            island.classList.add('active');
            island.innerHTML = `<div class="p-2 text-center animate__animated animate__fadeIn">
                                    <small class="d-block text-info" style="font-size:10px">${title}</small>
                                    <span style="font-size:12px">${msg}</span>
                                </div>`;
            
            setTimeout(() => {
                island.classList.remove('active');
                island.innerHTML = '';
            }, 4000);
        }
    </script>
</body>
</html>
