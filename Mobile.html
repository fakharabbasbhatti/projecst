<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus OS Ultra | Professional Simulation</title>
    
    <!-- Frameworks & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <style>
        /* --- GLOBAL THEME VARIABLES --- */
        :root {
            --os-bg: #000;
            --accent: #007aff; /* Apple Blue */
            --glass: rgba(255, 255, 255, 0.12);
            --glass-heavy: rgba(255, 255, 255, 0.25);
            --border-light: rgba(255, 255, 255, 0.1);
            --safe-area-top: 30px;
        }

        body {
            background: #1a1a1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- HARDWARE FRAME --- */
        .device-frame {
            width: 380px;
            height: 780px;
            background: #0b0b0b;
            border-radius: 55px;
            padding: 12px;
            position: relative;
            border: 5px solid #222;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8), 0 0 20px rgba(0, 122, 255, 0.1);
        }

        .dynamic-island {
            width: 110px;
            height: 30px;
            background: #000;
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 20px;
            z-index: 1000;
            transition: width 0.3s ease;
        }

        /* --- SCREEN CONTENT --- */
        .os-container {
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?ixlib=rb-1.2.1&auto=format&fit=crop&w=1364&q=80');
            background-size: cover;
            background-position: center;
            border-radius: 43px;
            position: relative;
            overflow: hidden;
        }

        /* --- CONTROL CENTER (SWIPE DOWN) --- */
        #control-center {
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(30px);
            z-index: 900;
            transition: 0.5s cubic-bezier(0.1, 0.7, 0.1, 1);
            padding: 60px 25px;
        }

        #control-center.active { top: 0; }

        .cc-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .cc-tile {
            background: var(--glass);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .cc-tile.active { background: var(--accent); }

        /* --- APPS & UI --- */
        .status-bar {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            font-size: 13px;
            font-weight: 600;
        }

        .home-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 25px;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: transform 0.2s;
        }

        .app-wrapper:active { transform: scale(0.85); }

        .app-icon-box {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            margin-bottom: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* --- APP WINDOWS --- */
        .window {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            color: #000;
            z-index: 800;
            transition: 0.4s ease-out;
            border-radius: 43px;
        }

        .window.open { top: 0; }

        .window-header {
            padding: 50px 20px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        /* --- DOCK --- */
        .bottom-dock {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            height: 85px;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            border: 1px solid var(--border-light);
        }

        /* --- THEMES --- */
        .theme-dark-os { background: #000 !important; color: #fff !important; }
        .bg-gradient-blue { background: linear-gradient(135deg, #007aff, #00d2ff); }
        .bg-gradient-purple { background: linear-gradient(135deg, #5856d6, #af52de); }
        .bg-gradient-orange { background: linear-gradient(135deg, #ff9500, #ffcc00); }

    </style>
</head>
<body>

    <div class="device-frame">
        <div class="dynamic-island" id="island"></div>
        
        <div class="os-container" id="os-root">
            
            <!-- Control Center Overlay -->
            <div id="control-center">
                <div class="cc-grid">
                    <div class="cc-tile active" onclick="toggleCC(this)">
                        <i class="fas fa-wifi"></i> <span>WiFi</span>
                    </div>
                    <div class="cc-tile" onclick="toggleCC(this)">
                        <i class="fas fa-bluetooth-b"></i> <span>BT</span>
                    </div>
                    <div class="cc-tile" onclick="toggleCC(this)">
                        <i class="fas fa-plane"></i> <span>AirMode</span>
                    </div>
                    <div class="cc-tile" onclick="toggleCC(this)">
                        <i class="fas fa-flashlight"></i> <span>Torch</span>
                    </div>
                </div>
                <div class="mt-4">
                    <label class="form-label text-white-50">Brightness</label>
                    <input type="range" class="form-range" oninput="setBrightness(this.value)">
                </div>
                <div class="text-center mt-5" onclick="toggleControlCenter()">
                    <i class="fas fa-chevron-up fa-2x"></i>
                </div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar" onclick="toggleControlCenter()">
                <span id="clock">12:00</span>
                <div class="d-flex gap-2 align-items-center">
                    <i class="fas fa-signal"></i>
                    <i class="fas fa-battery-full"></i>
                </div>
            </div>

            <!-- Homescreen -->
            <div class="home-grid">
                <!-- App 1 -->
                <div class="app-wrapper" onclick="openWindow('app-browser')">
                    <div class="app-icon-box bg-gradient-blue"><i class="fas fa-globe"></i></div>
                    <span>Safari</span>
                </div>
                <!-- App 2 -->
                <div class="app-wrapper" onclick="openWindow('app-settings')">
                    <div class="app-icon-box bg-secondary"><i class="fas fa-cog"></i></div>
                    <span>Settings</span>
                </div>
                <!-- App 3 -->
                <div class="app-wrapper" onclick="openWindow('app-calculator')">
                    <div class="app-icon-box bg-gradient-orange"><i class="fas fa-calculator"></i></div>
                    <span>Calc</span>
                </div>
                <!-- App 4 -->
                <div class="app-wrapper" onclick="openWindow('app-files')">
                    <div class="app-icon-box bg-gradient-purple"><i class="fas fa-folder"></i></div>
                    <span>Files</span>
                </div>
            </div>

            <!-- App: Browser -->
            <div id="app-browser" class="window">
                <div class="window-header">
                    <button class="btn btn-sm btn-light" onclick="closeWindow('app-browser')">Done</button>
                    <h6 class="mb-0">Web Browser</h6>
                    <i class="fas fa-rotate-right"></i>
                </div>
                <div class="p-3">
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="text" class="form-control" value="https://www.google.com">
                    </div>
                    <div class="text-center mt-5 text-muted">
                        <i class="fab fa-google fa-4x mb-3"></i>
                        <p>Search or enter website name</p>
                    </div>
                </div>
            </div>

            <!-- App: Calculator -->
            <div id="app-calculator" class="window theme-dark-os">
                <div class="window-header border-0">
                    <button class="btn btn-sm btn-dark" onclick="closeWindow('app-calculator')">Back</button>
                </div>
                <div class="p-3">
                    <div class="text-end mb-4">
                        <h1 id="calc-display" style="font-size: 4rem;">0</h1>
                    </div>
                    <div class="row g-2">
                        <div class="col-3"><button class="btn btn-secondary w-100 py-3 rounded-circle" onclick="calc(7)">7</button></div>
                        <div class="col-3"><button class="btn btn-secondary w-100 py-3 rounded-circle" onclick="calc(8)">8</button></div>
                        <div class="col-3"><button class="btn btn-secondary w-100 py-3 rounded-circle" onclick="calc(9)">9</button></div>
                        <div class="col-3"><button class="btn btn-warning w-100 py-3 rounded-circle">÷</button></div>
                        <div class="col-3"><button class="btn btn-secondary w-100 py-3 rounded-circle" onclick="calc(4)">4</button></div>
                        <div class="col-3"><button class="btn btn-secondary w-100 py-3 rounded-circle" onclick="calc(5)">5</button></div>
                        <div class="col-3"><button class="btn btn-secondary w-100 py-3 rounded-circle" onclick="calc(6)">6</button></div>
                        <div class="col-3"><button class="btn btn-warning w-100 py-3 rounded-circle">×</button></div>
                    </div>
                </div>
            </div>

            <!-- Dock -->
            <div class="bottom-dock">
                <div class="app-icon-box bg-success mb-0"><i class="fas fa-phone"></i></div>
                <div class="app-icon-box bg-info mb-0"><i class="fas fa-message"></i></div>
                <div class="app-icon-box bg-primary mb-0"><i class="fas fa-envelope"></i></div>
                <div class="app-icon-box bg-warning mb-0"><i class="fas fa-music"></i></div>
            </div>

            <!-- Home Indicator -->
            <div style="position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:120px; height:5px; background:white; border-radius:10px; cursor:pointer;" onclick="closeAll()"></div>
        </div>
    </div>

    <!-- SCRIPT ENGINE -->
    <script>
        // --- System Clock ---
        function updateTime() {
            const now = new Date();
            const time = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock').innerText = time;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // --- App Navigation ---
        function openWindow(id) {
            document.getElementById(id).classList.add('open');
            // Animate Dynamic Island
            const island = document.getElementById('island');
            island.style.width = '200px';
            setTimeout(() => island.style.width = '110px', 500);
        }

        function closeWindow(id) {
            document.getElementById(id).classList.remove('open');
        }

        function closeAll() {
            const windows = document.querySelectorAll('.window');
            windows.forEach(w => w.classList.remove('open'));
            document.getElementById('control-center').classList.remove('active');
        }

        // --- Control Center ---
        function toggleControlCenter() {
            document.getElementById('control-center').classList.toggle('active');
        }

        function toggleCC(el) {
            el.classList.toggle('active');
        }

        function setBrightness(val) {
            document.getElementById('os-root').style.filter = `brightness(${val}%)`;
        }

        // --- Basic Calculator Logic ---
        function calc(num) {
            const display = document.getElementById('calc-display');
            if(display.innerText === "0") display.innerText = num;
            else display.innerText += num;
        }

        // --- System Notifications Simulation ---
        setTimeout(() => {
            const island = document.getElementById('island');
            island.innerHTML = '<small class="text-white" style="font-size:10px; display:block; text-align:center; padding-top:5px;">Message from Fizza</small>';
            island.style.width = '180px';
            setTimeout(() => {
                island.style.width = '110px';
                island.innerHTML = '';
            }, 3000);
        }, 5000);
    </script>
</body>
</html>
